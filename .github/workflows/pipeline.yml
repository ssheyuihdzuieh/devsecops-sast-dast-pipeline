name: DevSecOps Pipeline

on:
  push:
    branches: [ main ]

jobs:
  test-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Say hello
        run: echo "Pipeline démarré avec succès !"

      - name: Install Semgrep
        run: pip install semgrep

      - name: Run Semgrep SAST scan
        run: semgrep scan --config p/security-audit --sarif --output semgrep.sarif juice-shop demo-vuln
        continue-on-error: true

      - name: Upload Semgrep report
        uses: actions/upload-artifact@v4
        with:
          name: semgrep-report
          path: semgrep.sarif

      - name: Check severity gate
        run: python3 check_severity.py

      - name: Start Juice Shop
        run: docker run -d -p 3000:3000 --name juice-shop bkimminich/juice-shop

      - name: Wait for Juice Shop to be ready
        run: |
          for i in {1..30}; do
            curl -sSf http://localhost:3000 > /dev/null && echo "Juice Shop is up" && break
            echo "Waiting for Juice Shop..."
            sleep 2
          done

      - name: Run OWASP ZAP baseline scan
        uses: zaproxy/action-baseline@v0.12.0
        with:
          target: 'http://localhost:3000'
          cmd_options: '-a'
        continue-on-error: true

      - name: Upload ZAP report
        uses: actions/upload-artifact@v4
        with:
          name: zap-report
          path: report_html.html
